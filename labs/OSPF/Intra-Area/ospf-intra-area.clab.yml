name: OSPF_Intra_Area

topology:
  nodes:
    R1:
      kind: cisco_c8000v
      image: vrnetlab/cisco_c8000v:17.13.01a
      startup-config: ./r1-base-config.partial.txt
    R2:
      kind: cisco_c8000v
      image: vrnetlab/cisco_c8000v:17.13.01a
      startup-config: ./r2-base-config.partial.txt
    R3:
      kind: cisco_c8000v
      image: vrnetlab/cisco_c8000v:17.13.01a
      startup-config: ./r3-base-config.partial.txt
    R4:
      kind: cisco_c8000v
      image: vrnetlab/cisco_c8000v:17.13.01a
      startup-config: ./r4-base-config.partial.txt
    R5:
      kind: cisco_c8000v
      image: vrnetlab/cisco_c8000v:17.13.01a
      startup-config: ./r5-base-config.partial.txt
    SW1:
      kind: cisco_vios
      type: switch
      image: vrnetlab/cisco_vios:L2-20200929

  links:
    - type: dummy
      endpoint:
        node: R1
        interface: Gi6
    - endpoints: ["R1:Gi2","R2:Gi2"]
    - endpoints: ["R2:Gi3","SW1:Gi0"]
    - endpoints: ["R3:Gi3","SW1:Gi1"]
    - endpoints: ["R4:Gi3","SW1:Gi2"]
    - endpoints: ["R4:Gi4","R5:Gi4"]

