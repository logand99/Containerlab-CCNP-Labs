    - endpoints: ["CoreSW1:Ethernet1/2","EdgeR2:Ethernet0/1"]
    - endpoints: ["CoreR1:Ethernet0/3","CoreR2:Ethernet0/3"]
    - endpoints: ["EdgeR1:Ethernet0/2","EdgeR2:Ethernet0/2"]
